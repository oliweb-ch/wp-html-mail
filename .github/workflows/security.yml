name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'  # Chaque lundi à 7h UTC

jobs:
  composer-audit:
    name: Composer Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - run: composer audit
